services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LAYOUT_SERVICE_URL: http://layout_ppdoclayoutv3_cpu:8000
      LAYOUT_TIMEOUT_SECONDS: 120
      OCR_SERVICE_URL: http://ocr_glm:8000
      OCR_TIMEOUT_SECONDS: 600
      OCR_ASYNC_ENABLED: "true"
      OCR_JOB_HTTP_TIMEOUT_SECONDS: 30
      OCR_JOB_POLL_INTERVAL_SECONDS: 5
      OCR_JOB_STALL_TIMEOUT_SECONDS: 600
      OCR_JOB_MAX_RUNTIME_SECONDS: 0
      VISION_SERVICE_URL: http://vision_llama:8000
      VISION_TIMEOUT_SECONDS: 1200
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      - layout_ppdoclayoutv3_cpu
      - ocr_glm
      - vision_llama

  layout_stub:
    build:
      context: .
      dockerfile: services/layout_stub/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./jobs:/app/jobs

  layout_ppdoclayoutv3_cpu:
    build:
      context: .
      dockerfile: services/layout_ppdoclayoutv3_cpu/Dockerfile
    ports:
      - "8004:8000"
    environment:
      LAYOUT_MODEL_DIR: /models/layout/pp-doclayoutv3
      LAYOUT_DEVICE: cpu
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models:ro

  ocr_stub:
    build:
      context: .
      dockerfile: services/ocr_stub/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./jobs:/app/jobs

  ocr_glm:
    build:
      context: .
      dockerfile: services/ocr_glm/Dockerfile
    ports:
      - "8005:8000"
    environment:
      OCR_MODEL_DIR: /models/ocr/glm-ocr
      OCR_MAX_NEW_TOKENS: 8192
      OCR_JOB_HEARTBEAT_INTERVAL_SECONDS: 15
      OCR_JOB_MAX_WORKERS: 1
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models:ro

  vision_llama:
    build:
      context: .
      dockerfile: services/vision_llama/Dockerfile
    ports:
      - "8006:8000"
    environment:
      LLAMA_SERVER_URL: http://host.docker.internal:8080
      LLAMA_TIMEOUT_SECONDS: 1200
      LLAMA_MAX_TOKENS: 512
      LLAMA_TEMPERATURE: 0.1
      VISION_MODEL_NAME: qwen3.6-27b-q4_k_m
      VISION_MODEL_VERSION: local-gguf
    volumes:
      - ./jobs:/app/jobs

  assembly_stub:
    build:
      context: ./services/assembly_stub
    ports:
      - "8003:8000"
