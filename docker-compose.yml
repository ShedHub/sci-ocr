services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LAYOUT_SERVICE_URL: http://layout_ppdoclayoutv3_cpu:8000
      LAYOUT_TIMEOUT_SECONDS: 120
      OCR_SERVICE_URL: http://ocr_glm:8000
      OCR_TIMEOUT_SECONDS: 600
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      - layout_ppdoclayoutv3_cpu
      - ocr_glm

  layout_stub:
    build:
      context: .
      dockerfile: services/layout_stub/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./jobs:/app/jobs

  layout_ppdoclayoutv3_cpu:
    build:
      context: .
      dockerfile: services/layout_ppdoclayoutv3_cpu/Dockerfile
    ports:
      - "8004:8000"
    environment:
      LAYOUT_MODEL_DIR: /models/layout/pp-doclayoutv3
      LAYOUT_DEVICE: cpu
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models:ro

  ocr_stub:
    build:
      context: .
      dockerfile: services/ocr_stub/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./jobs:/app/jobs

  ocr_glm:
    build:
      context: .
      dockerfile: services/ocr_glm/Dockerfile
    ports:
      - "8005:8000"
    environment:
      OCR_MODEL_DIR: /models/ocr/glm-ocr
      OCR_MAX_NEW_TOKENS: 8192
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models:ro

  assembly_stub:
    build:
      context: ./services/assembly_stub
    ports:
      - "8003:8000"
