services:
  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      LAYOUT_SERVICE_URL: http://layout_stub:8000
    volumes:
      - ./jobs:/app/jobs
    depends_on:
      - layout_stub

  layout_stub:
    build:
      context: ./services/layout_stub
    ports:
      - "8001:8000"
    volumes:
      - ./jobs:/app/jobs

  ocr_stub:
    build:
      context: ./services/ocr_stub
    ports:
      - "8002:8000"

  assembly_stub:
    build:
      context: ./services/assembly_stub
    ports:
      - "8003:8000"
