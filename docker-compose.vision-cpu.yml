services:
  llama_server_cpu:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "${LLAMA_SERVER_PORT:-8080}:8080"
    command:
      - -m
      - ${LLAMA_MODEL_PATH:-/models/vision/qwen3.6-27b/Qwen3.6-27B-Q4_K_M.gguf}
      - --mmproj
      - ${LLAMA_MMPROJ_PATH:-/models/vision/qwen3.6-27b/mmproj-F16.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${LLAMA_CONTEXT_SIZE:-4096}"
      - -t
      - "${LLAMA_THREADS:-16}"
    volumes:
      - ./models/vision:/models/vision:ro
    networks:
      default:
        aliases:
          - llama_server

  vision_llama:
    environment:
      LLAMA_SERVER_URL: http://llama_server:8080
    depends_on:
      - llama_server_cpu
